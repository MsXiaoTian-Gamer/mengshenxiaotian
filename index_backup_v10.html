<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>萌神小天 - 独立游戏开发博客</title>
  <meta name="description" content="萌神小天的独立游戏开发博客，分享Unity学习、游戏开发和独立游戏心得">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>萌</text></svg>">
  <style>
    /* Desktop article cards grid */
    .article-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 24px;
      max-width: var(--content-width);
    }
    .article-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      transition: all var(--transition);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .article-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--brand-soft);
    }
    .article-card .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-heading);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .article-card:hover .card-title { color: var(--brand); }
    .article-card .card-date {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      color: var(--text-faint);
    }
    .article-card .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .article-card .card-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.6rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .article-card .card-summary {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }
    /* Desktop: hide mobile-only */
    @media (min-width: 901px) {
      .mobile-only { display: none; }
      .article-cards-grid { display: grid; }
    }
    @media (max-width: 900px) {
      .article-cards-grid { display: none; }
      .mobile-article-list { display: block; }
    }
    @media (max-width: 768px) {
      .article-cards-grid { display: none; }
    }
    /* Daily quote */
    .daily-quote {
      text-align: center;
      margin: 24px 0 32px;
      padding: 16px 24px;
      background: var(--brand-ghost);
      border-radius: var(--radius);
      border: 1px solid var(--brand-soft);
      max-width: var(--content-width);
    }
    .daily-quote .quote-text {
      font-size: 0.9rem;
      color: var(--text);
      font-style: italic;
      line-height: 1.7;
    }
    .daily-quote .quote-author {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      color: var(--text-faint);
      margin-top: 8px;
    }
    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 24px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      color: var(--text-faint);
      max-width: var(--content-width);
      margin-bottom: 20px;
    }
    /* Empty state for search */
    .no-results {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      max-width: var(--content-width);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
<div id="progress-bar"></div>

<!-- Hearts background -->
<div class="hearts-bg" id="heartsBg"></div>

<!-- Hamburger menu -->
<button class="hamburger" id="hamburgerBtn" aria-label="菜单">
  <span></span><span></span><span></span>
</button>

<div class="layout" id="layout">
  <!-- ========== Sidebar ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-left">
        <a href="/">萌神小天</a>
        <p>独立游戏开发者</p>
      </div>
      <div class="header-actions">
        <button class="header-btn" onclick="toggleTheme()" title="切换主题" aria-label="切换主题" id="themeIcon">&#9790;</button>
      </div>
    </div>

    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input type="text" class="search-input" id="searchInput" placeholder="搜索文章..." autocomplete="off">
    </div>

    <!-- Tag filter -->
    <div class="tag-filters" id="tagFilters"></div>

    <!-- Article list -->
    <div class="article-list" id="articleList">
      <div class="article-list-title">文章列表</div>
      <div id="sidebarArticles"></div>
    </div>

    <!-- Sidebar footer -->
    <div class="sidebar-footer">
      <div id="siteStats"></div>
      <div class="social-links" id="socialLinks"></div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">
        <a href="/about.html" style="font-size:0.68rem;color:var(--text-faint);text-decoration:none;">关于</a>
        <span style="color:var(--text-faint);margin:0 6px;">|</span>
        <a href="/archive.html" style="font-size:0.68rem;color:var(--text-faint);text-decoration:none;">归档</a>
      </div>
    </div>
  </aside>

  <!-- ========== Main Content ========== -->
  <main class="main" id="mainContent">
    <!-- Hero Section -->
    <section class="hero" id="heroSection">
      <div class="hero-inner">
        <h1><span>萌神小天</span> 的博客</h1>
        <p>一个独立游戏开发者的学习笔记与创作记录。分享 Unity 开发经验、游戏设计心得和 TapTap 聚光灯参赛历程。</p>
        <div class="hero-meta">
          <span id="articleCount">&#9998; 0 篇文章</span>
          <span id="tagCount">&#127991; 0 个标签</span>
        </div>
      </div>
    </section>

    <!-- Stats -->
    <div class="stats-bar" id="statsBar"></div>

    <!-- Daily Quote -->
    <div class="daily-quote" id="dailyQuote"></div>

    <!-- Article Cards Grid (Desktop) -->
    <div class="article-cards-grid" id="articleCardsGrid"></div>

    <!-- Mobile Article List -->
    <div class="mobile-article-list mobile-only" id="mobileArticleList">
      <div class="mobile-article-list-title">最新文章</div>
      <div class="mobile-article-cards" id="mobileCards"></div>
    </div>

    <!-- No results -->
    <div class="no-results" id="noResults" style="display:none;">
      <p>没有找到匹配的文章，试试其他关键词吧~</p>
    </div>

    <!-- Intro card (when no articles match) -->
    <div id="introArea"></div>
  </main>
</div>

<!-- Back to Top -->
<button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="返回顶部">&#8593;</button>

<!-- Friendly Links Panel -->
<button class="fl-trigger" id="flTrigger" onclick="toggleFlinks()" title="友链">友链</button>
<div class="fl-overlay" id="flOverlay" onclick="toggleFlinks()"></div>
<div class="fl-panel" id="flPanel">
  <div class="fl-panel-header">
    <span class="fl-panel-title">友情链接</span>
    <button class="fl-panel-close" onclick="toggleFlinks()">&#10005;</button>
  </div>
  <div class="fl-panel-list" id="flPanelList"></div>
</div>

<!-- Kawaii Mascot -->
<!-- Kawaii Mascot (Anime Style) -->
<div class="kawaii-mascot" id="mascot" aria-hidden="true">
  <div class="mascot-body" id="mascotBody" title="点我试试~" aria-label="看板娘">
    <!-- Twin Tails -->
    <div class="mascot-tail left">
      <div class="mascot-tail-ribbon"></div>
    </div>
    <div class="mascot-tail right">
      <div class="mascot-tail-ribbon"></div>
    </div>
    <!-- Head -->
    <div class="mascot-head">
      <div class="mascot-bangs">
        <div class="mascot-bangs-notch"></div>
      </div>
      <div class="mascot-brow left"></div>
      <div class="mascot-brow right"></div>
      <div class="mascot-eye left">
        <div class="mascot-eye-hl"></div>
        <div class="mascot-eye-star"></div>
        <div class="mascot-eye-sparkle"></div>
        <div class="mascot-eye-sparkle2"></div>
      </div>
      <div class="mascot-eye right">
        <div class="mascot-eye-hl"></div>
        <div class="mascot-eye-star"></div>
        <div class="mascot-eye-sparkle"></div>
        <div class="mascot-eye-sparkle2"></div>
      </div>
      <div class="mascot-blush left"></div>
      <div class="mascot-blush right"></div>
      <div class="mascot-mouth"></div>
    </div>
    <!-- Body -->
    <div class="mascot-torso">
      <div class="mascot-top">
        <div class="mascot-collar"></div>
        <div class="mascot-tie"></div>
      </div>
      <div class="mascot-skirt"></div>
      <div class="mascot-arm left"></div>
      <div class="mascot-arm right"></div>
    </div>
    <div class="mascot-legs">
      <div class="mascot-leg"></div>
      <div class="mascot-leg"></div>
    </div>
  </div>
  <div class="mascot-bubble" id="mascotBubble" aria-live="polite">你好呀~</div>
</div>
</div>

<script src="js/articles.js"></script>
<script src="js/app.js"></script>
<script>
// ====== CONSTANTS ======
var QUOTES = [
  { text: '游戏是让人快乐的，做游戏也是。', author: '萌神小天' },
  { text: 'Bug 不是缺陷，是尚未被理解的特性。', author: '萌神小天' },
  { text: '代码能跑就行，但能跑得优雅更好。', author: '萌神小天' },
  { text: '独立开发是一场马拉松，不是百米冲刺。', author: '萌神小天' },
  { text: '每一个伟大的游戏都从一个简单的想法开始。', author: '萌神小天' },
  { text: '不要等待灵感，动手就是最好的灵感。', author: '萌神小天' },
  { text: '学习 Unity 最好的方式就是做一个游戏。', author: '萌神小天' }
];

// ====== State ======
var currentTag = 'all';

// ====== Theme ======
function initTheme() {
  var saved = localStorage.getItem('blog_theme') || 'light';
  if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  updateThemeIcon();
}

function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme');
  var next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('blog_theme', next);
  updateThemeIcon();
}

function updateThemeIcon() {
  var icon = document.getElementById('themeIcon');
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (icon) icon.innerHTML = isDark ? '&#9788;' : '&#9790;';
}

// ====== Hearts ======
function initHearts() {
  var container = document.getElementById('heartsBg');
  if (!container) return;
  for (var i = 0; i < 15; i++) {
    var wrap = document.createElement('div');
    wrap.className = 'heart-wrap';
    wrap.style.cssText = '--size:' + (8 + Math.random() * 16) + 'px;' +
      '--dur:' + (6 + Math.random() * 10) + 's;' +
      '--delay:' + (Math.random() * 8) + 's;' +
      'left:' + (Math.random() * 90) + '%;' +
      'top:' + (Math.random() * 80) + '%;';
    var heart = document.createElement('div');
    heart.className = 'heart';
    wrap.appendChild(heart);
    container.appendChild(wrap);
  }
}

// ====== Article Rendering ======
function getSummary(content) {
  if (!content) return '';
  var text = content.replace(/---[\s\S]*?---/, '').replace(/[#*`\-_>\[\]()!|~]/g, ' ').replace(/\s+/g, ' ').trim();
  return text.length > 100 ? text.substring(0, 100) + '...' : text;
}

function renderSidebar(articles) {
  var container = document.getElementById('sidebarArticles');
  if (!container) return;
  var html = '';
  articles.forEach(function(a) {
    var badge = getDateBadge(a.date);
    var time = estimateReadingTime(getArticleContent(a));
    var primaryTag = getPrimaryTag(a) || (a.tags && a.tags[0]);
    var colors = getTagColors(primaryTag);
    var tagsHtml = (a.tags || []).map(function(t) {
      var tc = getTagColors(t);
      return '<span class="item-tag" style="--item-tag-color:' + tc.color + ';--item-tag-bg:' + tc.bg + '">' + t + '</span>';
    }).join('');
    html += '<a href="/articles/' + a.path.replace('.md', '.html') + '" class="article-item">' +
      '<div class="date-badge"><div class="badge-month">' + badge.month + '</div><div class="badge-day">' + badge.day + '</div></div>' +
      '<div class="item-body"><div class="item-title">' + a.title + '</div>' +
      '<div class="item-meta"><span>' + a.date + '</span><span class="reading-time">' + time + ' min</span></div>' +
      '<div class="item-tags">' + tagsHtml + '</div></div></a>';
  });
  container.innerHTML = html;
}

function renderCards(articles) {
  var grid = document.getElementById('articleCardsGrid');
  if (!grid) return;
  var html = '';
  articles.forEach(function(a) {
    var content = getArticleContent(a);
    var summary = getSummary(content);
    var primaryTag = getPrimaryTag(a) || (a.tags && a.tags[0]);
    var colors = getTagColors(primaryTag);
    var tagsHtml = (a.tags || []).map(function(t) {
      var tc = getTagColors(t);
      return '<span class="card-tag" style="background:' + tc.bg + ';color:' + tc.color + '">' + t + '</span>';
    }).join('');
    html += '<a href="/articles/' + a.path.replace('.md', '.html') + '" class="article-card">' +
      '<div class="card-date">' + a.date + '</div>' +
      '<div class="card-title">' + a.title + '</div>' +
      '<div class="card-tags">' + tagsHtml + '</div>' +
      '<div class="card-summary">' + summary + '</div></a>';
  });
  grid.innerHTML = html || '<div class="empty-state"><p>暂无文章</p></div>';
}

function renderMobileCards(articles) {
  var container = document.getElementById('mobileCards');
  if (!container) return;
  var html = '';
  articles.forEach(function(a) {
    var badge = getDateBadge(a);
    var tagsHtml = (a.tags || []).map(function(t) {
      return '<span class="mobile-card-tag">' + t + '</span>';
    }).join('');
    html += '<a href="/articles/' + a.path.replace('.md', '.html') + '" class="mobile-card">' +
      '<div class="mobile-card-title">' + a.title + '</div>' +
      '<div class="mobile-card-meta"><span class="mobile-card-time">' + a.date + '</span><span>' + estimateReadingTime(getArticleContent(a)) + ' min</span></div>' +
      '<div class="mobile-card-tags">' + tagsHtml + '</div></a>';
  });
  container.innerHTML = html;
}

// ====== Tag Filter ======
function renderTagFilters(articles) {
  var container = document.getElementById('tagFilters');
  if (!container) return;
  var tagCount = {};
  articles.forEach(function(a) {
    (a.tags || []).forEach(function(t) {
      tagCount[t] = (tagCount[t] || 0) + 1;
    });
  });
  var tags = Object.keys(tagCount).sort(function(a, b) { return tagCount[b] - tagCount[a]; });
  var html = '<button class="tag-btn' + (currentTag === 'all' ? ' active' : '') + '" data-tag="all">全部 (' + articles.length + ')</button>';
  tags.forEach(function(t) {
    html += '<button class="tag-btn' + (currentTag === t ? ' active' : '') + '" data-tag="' + t + '">' + t + ' (' + tagCount[t] + ')</button>';
  });
  container.innerHTML = html;

  container.querySelectorAll('.tag-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      currentTag = this.getAttribute('data-tag');
      document.getElementById('searchInput').value = '';
      refreshAll();
    });
  });
}

// ====== Search ======
function initSearch() {
  var input = document.getElementById('searchInput');
  if (!input) return;
  input.addEventListener('input', function() {
    currentTag = 'all';
    refreshAll();
  });
}

// ====== Refresh ======
function refreshAll() {
  var all = getAllArticles();
  var query = (document.getElementById('searchInput').value || '').toLowerCase().trim();

  var filtered;
  if (currentTag !== 'all') {
    filtered = all.filter(function(a) { return (a.tags || []).indexOf(currentTag) >= 0; });
  } else {
    filtered = all;
  }

  if (query) {
    filtered = filtered.filter(function(a) {
      return a.title.toLowerCase().indexOf(query) >= 0 ||
        (a.tags || []).some(function(t) { return t.toLowerCase().indexOf(query) >= 0; });
    });
  }

  renderSidebar(filtered);
  renderCards(filtered);
  renderMobileCards(filtered);
  renderTagFilters(all);

  var noResults = document.getElementById('noResults');
  var cardsGrid = document.getElementById('articleCardsGrid');
  var mobileList = document.getElementById('mobileArticleList');
  if (noResults) noResults.style.display = filtered.length === 0 ? 'block' : 'none';
  if (cardsGrid) cardsGrid.style.display = filtered.length === 0 ? 'none' : '';

  // Update hero stats
  document.getElementById('articleCount').innerHTML = '&#9998; ' + all.length + ' 篇文章';
  var allTags = {};
  all.forEach(function(a) { (a.tags || []).forEach(function(t) { allTags[t] = true; }); });
  document.getElementById('tagCount').innerHTML = '&#127991; ' + Object.keys(allTags).length + ' 个标签';
}

// ====== Daily Quote ======
function initDailyQuote() {
  var container = document.getElementById('dailyQuote');
  if (!container) return;
  var quote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  container.innerHTML = '<div class="quote-text">' + quote.text + '</div><div class="quote-author">—— ' + quote.author + '</div>';
}

// ====== Stats ======
function initStats() {
  var bar = document.getElementById('statsBar');
  var articles = getAllArticles();
  var totalWords = 0;
  articles.forEach(function(a) {
    totalWords += countWords(getArticleContent(a));
  });
  if (bar) {
    bar.innerHTML = '<span>共 ' + articles.length + ' 篇文章</span><span>约 ' + (totalWords > 1000 ? (totalWords / 1000).toFixed(1) + 'k' : totalWords) + ' 字</span><span id="runningTime"></span>';
  }

  // Site footer stats
  var statsEl = document.getElementById('siteStats');
  if (statsEl) {
    statsEl.innerHTML = '共 ' + articles.length + ' 篇文章 | 始于 2025';
  }
}

// ====== Running Time ======
function initRunningTime() {
  var start = new Date('2025-10-11');
  function update() {
    var now = new Date();
    var diff = Math.floor((now - start) / 1000);
    var days = Math.floor(diff / 86400);
    var el = document.getElementById('runningTime');
    if (el) el.textContent = '已运行 ' + days + ' 天';
  }
  update();
  setInterval(update, 60000);
}

// ====== Friend Links ======
function initFlinks() {
  var list = document.getElementById('flPanelList');
  if (!list) return;
  var flinks = [
    { name: '萌神小天 GitHub', url: 'https://github.com/MsXiaoT-Gamer', desc: '代码仓库' },
    { name: '小绿虫的冒险蹦践', url: 'https://www.taptap.cn/app/779424', desc: 'TapTap 游戏页' }
  ];
  var html = '';
  flinks.forEach(function(f) {
    html += '<div class="fl-item" style="margin-bottom:12px;"><a href="' + f.url + '" target="_blank" style="color:var(--brand);text-decoration:none;font-weight:500;">' + f.name + '</a><div style="font-size:0.72rem;color:var(--text-faint);">' + f.desc + '</div></div>';
  });
  list.innerHTML = html;
}

function toggleFlinks() {
  document.getElementById('flOverlay').classList.toggle('active');
  document.getElementById('flPanel').classList.toggle('active');
}

// ====== Mascot ======
var mascotMessages = [
  '今天也要加油~', '欢迎来看博客！', '有什么想看的吗？', 'Unity 超好玩的！', '一起做游戏吧~',
  '记得休息眼睛哦', '代码敲累了吗？', 'Bug 退散！', '今天写了几行代码？', '芜湖~'
];
function mascotClick() {
  var bubble = document.getElementById('mascotBubble');
  if (!bubble) return;
  var msg = mascotMessages[Math.floor(Math.random() * mascotMessages.length)];
  bubble.textContent = msg;
  bubble.classList.remove('show');
  void bubble.offsetWidth;
  bubble.classList.add('show');
}
function initMascot() {
  var bubble = document.getElementById('mascotBubble');
  if (!bubble) return;
  bubble.classList.add('show');
  setInterval(function() {
    if (!bubble.classList.contains('show')) {
      mascotClick();
    }
  }, 8000);
}

// ====== Hamburger ======
function initHamburger() {
  var btn = document.getElementById('hamburgerBtn');
  var layout = document.getElementById('layout');
  if (!btn || !layout) return;
  btn.addEventListener('click', function() {
    layout.classList.toggle('nav-open');
  });
  layout.addEventListener('click', function(e) {
    if (layout.classList.contains('nav-open') && !e.target.closest('.sidebar') && !e.target.closest('.hamburger')) {
      layout.classList.remove('nav-open');
    }
  });
}

// ====== Back to Top ======
function initBackToTop() {
  var btn = document.getElementById('back-to-top');
  if (!btn) return;
  window.addEventListener('scroll', function() {
    var scrollTop = window.scrollY || document.documentElement.scrollTop;
    btn.style.display = scrollTop > 400 ? 'flex' : 'none';
  });
}

// ====== Init ======
document.addEventListener('DOMContentLoaded', function() {
  initTheme();
  initHearts();
  initSearch();
  initHamburger();
  initBackToTop();
  initDailyQuote();
  initStats();
  initRunningTime();
  initFlinks();
  initMascot();
  refreshAll();
});
</script>
</body>
</html>

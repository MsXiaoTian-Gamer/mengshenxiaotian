<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章归档 - 萌神小天</title>
  <meta name="description" content="萌神小天博客文章归档">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>萌</text></svg>">
  <style>
    body { background: var(--bg); }
    .archive-nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px; display: flex; align-items: center; gap: 16px;
    }
    .archive-nav a {
      color: var(--text); text-decoration: none; font-size: 0.95rem;
      display: flex; align-items: center; gap: 6px; font-weight: 500;
    }
    .archive-nav a:hover { color: var(--brand); }
    .archive-nav .nav-divider { flex: 1; }
    .archive-nav .theme-btn {
      background: none; border: none; cursor: pointer; font-size: 1.1rem;
      color: var(--text); padding: 4px 8px;
    }
    .archive-container {
      max-width: 680px; margin: 0 auto; padding: 48px 20px 72px;
    }
    .archive-title {
      font-size: 1.6rem; font-weight: 700; color: var(--text-heading);
      margin-bottom: 36px; padding-bottom: 16px;
      border-bottom: 2px solid var(--brand-soft);
    }
    .archive-year {
      margin-bottom: 32px;
    }
    .archive-year-title {
      font-family: "JetBrains Mono", monospace;
      font-size: 1.1rem; font-weight: 700; color: var(--brand);
      margin-bottom: 14px; padding-left: 12px;
      border-left: 3px solid var(--brand);
      cursor: pointer; user-select: none;
      display: flex; align-items: center; gap: 6px;
    }
    .archive-item {
      display: flex; align-items: baseline; gap: 16px;
      padding: 8px 12px; border-radius: var(--radius-sm);
      transition: background var(--transition);
    }
    .archive-item:hover { background: var(--surface-hover); }
    .archive-item .archive-date {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem; color: var(--text-faint);
      white-space: nowrap; min-width: 90px;
    }
    .archive-item .archive-link {
      font-size: 0.92rem; color: var(--text);
      text-decoration: none; line-height: 1.4;
      transition: color var(--transition);
    }
    .archive-item .archive-link:hover { color: var(--brand); }
    .archive-count {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem; color: var(--brand);
      font-weight: 600; margin-left: 8px;
    }
    .archive-year-body { overflow: hidden; transition: max-height 0.3s ease; }
    .archive-year-body.collapsed { max-height: 0 !important; }
    .archive-year-title .collapse-icon {
      font-size: 0.7rem; transition: transform 0.25s;
      display: inline-block;
    }
    .archive-year-title.collapsed .collapse-icon { transform: rotate(-90deg); }
    /* Tag filter bar */
    .archive-tag-filters {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px;
    }
    .archive-tag-btn {
      padding: 4px 14px; border-radius: 16px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-muted);
      font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
    }
    .archive-tag-btn:hover, .archive-tag-btn.active {
      background: var(--brand-soft); color: var(--brand);
      border-color: var(--brand);
    }
  </style>
</head>
<body>

<nav class="archive-nav">
  <a href="/" title="回到首页">&#8592; 萌神小天</a>
  <span class="nav-divider"></span>
  <span style="font-size:0.9rem;color:var(--text-secondary);">归档</span>
  <button class="theme-btn" onclick="toggleTheme()" title="切换深色/浅色模式" aria-label="切换主题">&#9790;</button>
</nav>

<div class="archive-container">
  <h1 class="archive-title">文章归档</h1>
  <div class="archive-tag-filters" id="archiveTagFilters"></div>
  <div id="archiveContent"></div>
</div>

<script src="js/articles.js"></script>
<script src="js/app.js"></script>
<script>
function toggleTheme() {
  var html = document.documentElement;
  if (html.getAttribute('data-theme') === 'dark') {
    html.removeAttribute('data-theme');
    localStorage.setItem('blog_theme', 'light');
  } else {
    html.setAttribute('data-theme', 'dark');
    localStorage.setItem('blog_theme', 'dark');
  }
}

(function() {
  var saved = localStorage.getItem('blog_theme');
  if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else if (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();

var currentArchiveTag = 'all';

function renderArchive(filterTag) {
  filterTag = filterTag || 'all';
  var articles = ARTICLES.slice().sort(function(a, b) { return b.date.localeCompare(a.date); });
  
  // Filter by tag
  var filtered = articles;
  if (filterTag !== 'all') {
    filtered = articles.filter(function(a) { return (a.tags || []).indexOf(filterTag) >= 0; });
  }
  
  var years = {};
  filtered.forEach(function(a) {
    var year = a.date.substring(0, 4);
    if (!years[year]) years[year] = [];
    years[year].push(a);
  });

  var yearKeys = Object.keys(years).sort(function(a, b) { return b.localeCompare(a); });
  var html = '';
  yearKeys.forEach(function(year) {
    var items = years[year];
    html += '<div class="archive-year" data-year="' + year + '">';
    html += '<h2 class="archive-year-title" onclick="toggleYear(this)" title="点击折叠/展开">';
    html += '<span class="collapse-icon">&#9660;</span>';
    html += year + ' 年<span class="archive-count">' + items.length + ' 篇</span>';
    html += '</h2>';
    html += '<div class="archive-year-body">';
    items.forEach(function(a) {
      var colors = typeof getTagColors === 'function' ? getTagColors((a.tags || [])[0]) : {color:'var(--brand)',bg:'var(--brand-soft)'};
      var tagsMini = (a.tags || []).map(function(t) {
        return '<span style="font-size:0.65rem;padding:1px 6px;border-radius:8px;margin-left:4px;background:' + colors.bg + ';color:' + colors.color + '">' + t + '</span>';
      }).join('');
      html += '<div class="archive-item">';
      html += '<span class="archive-date">' + a.date + '</span>';
      html += '<a class="archive-link" href="/articles/' + a.path.replace('.md', '.html') + '">' + a.title + '</a>';
      html += '<span style="flex:1"></span>' + tagsMini;
      html += '</div>';
    });
    html += '</div>';
    html += '</div>';
  });

  document.getElementById('archiveContent').innerHTML = html || '<p style="color:var(--text-muted);text-align:center;">没有匹配的文章</p>';
}

function toggleYear(el) {
  el.classList.toggle('collapsed');
  var body = el.nextElementSibling;
  if (body) body.classList.toggle('collapsed');
}

// Render tag filters
function renderArchiveTagFilters() {
  var articles = ARTICLES.slice().sort(function(a, b) { return b.date.localeCompare(a.date); });
  var tagCount = {};
  articles.forEach(function(a) {
    (a.tags || []).forEach(function(t) { tagCount[t] = (tagCount[t] || 0) + 1; });
  });
  var tags = Object.keys(tagCount).sort(function(a, b) { return tagCount[b] - tagCount[a]; });
  var html = '<button class="archive-tag-btn active" data-tag="all" onclick="filterArchive(\'all\',this)">全部 (' + articles.length + ')</button>';
  tags.forEach(function(t) {
    html += '<button class="archive-tag-btn" data-tag="' + t + '" onclick="filterArchive(\'' + t.replace(/'/g, "\\'") + '\',this)">' + t + ' (' + tagCount[t] + ')</button>';
  });
  document.getElementById('archiveTagFilters').innerHTML = html;
}

function filterArchive(tag, btn) {
  currentArchiveTag = tag;
  document.querySelectorAll('.archive-tag-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  renderArchive(tag);
}

(function() {
  renderArchiveTagFilters();
  renderArchive('all');
})();
</script>
<!-- Kawaii Mascot (Anime Style) -->
<div class="kawaii-mascot" id="mascot" aria-hidden="true">
  <div class="mascot-body" id="mascotBody" title="点我试试~" aria-label="看板娘">
    <!-- Twin Tails -->
    <div class="mascot-tail left">
      <div class="mascot-tail-ribbon"></div>
    </div>
    <div class="mascot-tail right">
      <div class="mascot-tail-ribbon"></div>
    </div>
    <!-- Head -->
    <div class="mascot-head">
      <div class="mascot-bangs">
        <div class="mascot-bangs-notch"></div>
      </div>
      <div class="mascot-brow left"></div>
      <div class="mascot-brow right"></div>
      <div class="mascot-eye left">
        <div class="mascot-eye-hl"></div>
        <div class="mascot-eye-star"></div>
        <div class="mascot-eye-sparkle"></div>
        <div class="mascot-eye-sparkle2"></div>
      </div>
      <div class="mascot-eye right">
        <div class="mascot-eye-hl"></div>
        <div class="mascot-eye-star"></div>
        <div class="mascot-eye-sparkle"></div>
        <div class="mascot-eye-sparkle2"></div>
      </div>
      <div class="mascot-blush left"></div>
      <div class="mascot-blush right"></div>
      <div class="mascot-mouth"></div>
    </div>
    <!-- Body -->
    <div class="mascot-torso">
      <div class="mascot-top">
        <div class="mascot-collar"></div>
        <div class="mascot-tie"></div>
      </div>
      <div class="mascot-skirt"></div>
      <div class="mascot-arm left"></div>
      <div class="mascot-arm right"></div>
    </div>
    <div class="mascot-legs">
      <div class="mascot-leg"></div>
      <div class="mascot-leg"></div>
    </div>
  </div>
  <div class="mascot-bubble" id="mascotBubble" aria-live="polite">你好呀~</div>
</div>
<script>
var mascotMessages = [
  '今天也要加油~', '欢迎来看博客！', '有什么想看的吗？', 'Unity 超好玩的！', '一起做游戏吧~',
  '记得休息眼睛哦', '代码敲累了吗？', 'Bug 退散！', '今天写了几行代码？', '芜湖~'
];
function mascotClick() {
  var bubble = document.getElementById('mascotBubble');
  if (!bubble) return;
  var msg = mascotMessages[Math.floor(Math.random() * mascotMessages.length)];
  bubble.textContent = msg;
  bubble.classList.remove('show');
  void bubble.offsetWidth;
  bubble.classList.add('show');
}

// ====== Mascot Drag ======
(function() {
  var container = document.getElementById('mascot');
  var body = document.getElementById('mascotBody');
  if (!container || !body) return;

  var startX = 0, startY = 0, startLeft = 0, startTop = 0;
  var dragging = false, movedDistance = 0;
  var defaultRight = 22, defaultBottom = 74;

  var savedX = localStorage.getItem('mascot_x');
  var savedY = localStorage.getItem('mascot_y');
  if (savedX !== null && savedY !== null) {
    container.style.right = 'auto';
    container.style.bottom = 'auto';
    container.style.left = savedX + 'px';
    container.style.top = savedY + 'px';
  }

  function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

  function setDragging(on) {
    dragging = on;
    if (on) {
      container.classList.add('dragging');
      container.style.transition = 'none';
    } else {
      container.classList.remove('dragging');
      container.style.transition = '';
    }
  }

  function onStart(e) {
    e.preventDefault();
    var pos = e.touches ? e.touches[0] : e;
    startX = pos.clientX;
    startY = pos.clientY;
    var rect = container.getBoundingClientRect();
    startLeft = rect.left;
    startTop = rect.top;
    movedDistance = 0;
    setDragging(true);
  }

  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    var pos = e.touches ? e.touches[0] : e;
    var dx = pos.clientX - startX;
    var dy = pos.clientY - startY;
    var newLeft = startLeft + dx;
    var newTop = startTop + dy;
    movedDistance = Math.sqrt(dx * dx + dy * dy);

    var maxLeft = window.innerWidth - container.offsetWidth;
    var maxTop = window.innerHeight - container.offsetHeight;
    newLeft = clamp(newLeft, 0, maxLeft);
    newTop = clamp(newTop, 0, maxTop);

    container.style.right = 'auto';
    container.style.bottom = 'auto';
    container.style.left = newLeft + 'px';
    container.style.top = newTop + 'px';
  }

  function onEnd(e) {
    if (!dragging) return;
    setDragging(false);

    if (movedDistance < 3) {
      if (savedX !== null && savedY !== null) {
        container.style.left = savedX + 'px';
        container.style.top = savedY + 'px';
      } else {
        container.style.left = '';
        container.style.top = '';
        container.style.right = defaultRight + 'px';
        container.style.bottom = defaultBottom + 'px';
      }
      mascotClick();
      return;
    }

    var rect = container.getBoundingClientRect();
    var left = Math.round(rect.left);
    var top = Math.round(rect.top);
    localStorage.setItem('mascot_x', left);
    localStorage.setItem('mascot_y', top);
    container.style.left = left + 'px';
    container.style.top = top + 'px';
    container.style.right = 'auto';
    container.style.bottom = 'auto';
  }

  body.addEventListener('mousedown', onStart);
  body.addEventListener('touchstart', onStart, { passive: false });
  document.addEventListener('mousemove', onMove, { passive: false });
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
})();

var _mascotBubbleTimer = null;
function initMascot() {
  var bubble = document.getElementById('mascotBubble');
  if (!bubble) return;
  bubble.classList.add('show');
  if (_mascotBubbleTimer) clearInterval(_mascotBubbleTimer);
  _mascotBubbleTimer = setInterval(function() {
    if (!bubble.classList.contains('show')) {
      mascotClick();
    }
  }, 8000);
}
document.addEventListener('DOMContentLoaded', function() {
  initMascot();
});
</script>
</body>
</html>
